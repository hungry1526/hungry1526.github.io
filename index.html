<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>HJ Hang Blog</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #0f0f11;
      --surface: #1a1a1f;
      --border: #2a2a32;
      --accent: #7c6aff;
      --accent-light: #a594ff;
      --text: #e8e8f0;
      --muted: #888899;
      --tag-bg: #252530;
    }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      line-height: 1.7;
      min-height: 100vh;
    }

    header {
      border-bottom: 1px solid var(--border);
      padding: 0 2rem;
      position: sticky;
      top: 0;
      background: rgba(15, 15, 17, 0.85);
      backdrop-filter: blur(12px);
      z-index: 100;
    }

    .header-inner {
      max-width: 780px;
      margin: 0 auto;
      display: flex;
      align-items: center;
      justify-content: space-between;
      height: 60px;
    }

    .logo {
      font-size: 1.1rem;
      font-weight: 700;
      color: var(--text);
      text-decoration: none;
      letter-spacing: -0.02em;
    }

    .logo span { color: var(--accent); }

    nav a {
      color: var(--muted);
      text-decoration: none;
      font-size: 0.9rem;
      margin-left: 1.5rem;
      transition: color 0.2s;
    }

    nav a:hover { color: var(--text); }

    .hero {
      max-width: 780px;
      margin: 0 auto;
      padding: 5rem 2rem 3rem;
    }

    .hero h1 {
      font-size: clamp(2rem, 5vw, 3rem);
      font-weight: 800;
      letter-spacing: -0.04em;
      line-height: 1.15;
      margin-bottom: 1rem;
    }

    .hero h1 span { color: var(--accent); }

    .hero p {
      color: var(--muted);
      font-size: 1.05rem;
      max-width: 480px;
    }

    .divider {
      max-width: 780px;
      margin: 0 auto;
      padding: 0 2rem;
      border-top: 1px solid var(--border);
    }

    .section-label {
      font-size: 0.75rem;
      font-weight: 600;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: var(--muted);
      padding: 2rem 2rem 1rem;
      max-width: 780px;
      margin: 0 auto;
    }

    .posts {
      max-width: 780px;
      margin: 0 auto;
      padding: 0 2rem 4rem;
    }

    .post-card {
      display: flex;
      flex-direction: column;
      gap: 0.4rem;
      padding: 1.5rem 0;
      border-bottom: 1px solid var(--border);
      text-decoration: none;
      color: inherit;
      transition: opacity 0.2s;
    }

    .post-card:hover { opacity: 0.75; }

    .post-meta {
      display: flex;
      align-items: center;
      gap: 0.75rem;
      font-size: 0.8rem;
      color: var(--muted);
    }

    .tag {
      background: var(--tag-bg);
      color: var(--accent-light);
      padding: 0.15rem 0.55rem;
      border-radius: 4px;
      font-size: 0.75rem;
      font-weight: 500;
    }

    .post-title {
      font-size: 1.15rem;
      font-weight: 600;
      letter-spacing: -0.02em;
      color: var(--text);
    }

    .post-excerpt {
      font-size: 0.9rem;
      color: var(--muted);
    }

    footer {
      border-top: 1px solid var(--border);
      text-align: center;
      padding: 2rem;
      color: var(--muted);
      font-size: 0.82rem;
    }

    footer a { color: var(--accent-light); text-decoration: none; }
  </style>
</head>
<body>

  <header>
    <div class="header-inner">
      <a href="/" class="logo">HJ<span>.</span>Hang</a>
      <nav>
        <a href="#">Blog</a>
        <a href="#">Projects</a>
        <a href="#">About</a>
      </nav>
    </div>
  </header>

  <section class="hero">
    <h1>HJ Hang <span>Blog</span></h1>
    <p>Thoughts on engineering, agents, and building things that matter.</p>
  </section>

  <div class="divider"></div>
  <div class="section-label">Latest Posts</div>

  <main class="posts">

    <a href="/posts/building-my-first-ai-agent-workflow.html" class="post-card">
      <div class="post-meta">
        <span>Mar 24, 2026</span>
        <span class="tag">Agents</span>
      </div>
      <div class="post-title">Building My First AI Agent Workflow</div>
      <div class="post-excerpt">How I automated my GitHub repository management using AI agents and the gh CLI.</div>
    </a>


  </main>

  <footer>
    &copy; 2026 HJ Hang &mdash; <a href="https://github.com/hungry1526" target="_blank">GitHub</a>
  </footer>

</body>
</html>
